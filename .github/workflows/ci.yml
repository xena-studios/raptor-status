name: CI

# Pull requests: the page builds (which also checks every incident file
# against the schema) and the checker's types and tests pass. Pushes to main
# get the same from the deploy workflows, which won't deploy a failed build.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          PUBLIC_STATUS_BASE: https://example.blob.core.windows.net/status

  checker:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: checker/package-lock.json
      - run: npm ci
        working-directory: checker
      - run: npm run typecheck && npm test && npm run build
        working-directory: checker
