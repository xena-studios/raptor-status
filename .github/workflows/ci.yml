name: CI

# Pull requests: the code is linted and formatted, the page builds (which also
# checks every incident file against the schema) and typechecks, and the
# checker's types and tests pass. Pushes to main get the build and tests from
# the deploy workflows, which won't deploy a failed build.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  site:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter raptor-status-site...
      - working-directory: site
        env:
          PUBLIC_STATUS_BASE: https://example.blob.core.windows.net/status
        run: |
          pnpm typecheck
          pnpm build

  checker:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: checker/.nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter raptor-status-checker...
      - working-directory: checker
        run: |
          pnpm typecheck
          pnpm test
          pnpm build
