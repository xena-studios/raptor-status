name: Deploy checker

# Tests, builds, and deploys the Azure Function on pushes to main that touch
# it. Signs in to Azure with GitHub's OIDC token: no Azure secret is stored
# here (docs/SETUP.md, step 7).
on:
  push:
    branches: [main]
    paths:
      - "checker/**"
      - "components.json"
      - "shared/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-checker.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-checker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: checker/.nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter raptor-status-checker...
      - working-directory: checker
        run: |
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm package
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: checker/out/checker.zip
          sku: flexconsumption
